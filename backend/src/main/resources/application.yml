server:
  port: ${BACKEND_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: ev-insurance-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/ev_insurance}
    username: ${DB_USERNAME:ev_insurance}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    # Preserve the existing API/snapshot defaults while using Jackson 3.
    use-jackson2-defaults: true
    default-property-inclusion: non_null

mybatis-plus:
  type-handlers-package: com.evinsurance.platform.pricing.infrastructure
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
